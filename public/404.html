<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aurelia Hotel & Resort</title>
  <script>
    // GitHub Pages SPA Single Page App Router Redirect Fallback
    (function() {
      var l = window.location;
      // If requested page is /admin or /admin.html, redirect smoothly to admin.html
      if (l.pathname.endsWith('/admin') || l.pathname.endsWith('/admin/')) {
        l.replace(l.protocol + '//' + l.host + l.pathname.replace(/\/admin\/?$/, '/admin.html') + l.search + l.hash);
        return;
      }
      // Otherwise redirect to main site index.html with query parameters preserved
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, -1).join('/') + '/index.html' +
        '?p=' + encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    })();
  </script>
</head>
<body style="background-color: #0c0a09; color: #f59e0b; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <h2 style="margin-bottom: 8px;">Aurelia Hotel & Resort</h2>
    <p style="color: #a8a29e; font-size: 14px;">Redirecting to sanctuary experience...</p>
  </div>
</body>
</html>
